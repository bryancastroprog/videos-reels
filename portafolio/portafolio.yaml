# ============================================================
#  PÓRTICO · datos del portafolio
#  Para agregar un proyecto: crea portafolio/proyectos/ID/ con
#  sus imágenes (verticales u horizontales) y agrégalo abajo.
#  Luego:  python3 portafolio/generar_portafolio.py
# ============================================================

edicion: "Portafolio 2026"

# Imagen de la portada del portafolio (si no se indica, usa la del primer proyecto)
portada:
  proyecto: navante
  imagen: mueble-amarillo.jpg
  encuadre: "52% 50%"

estudio:
  frase: "Documentamos la arquitectura tal como fue pensada."
  texto: >-
    Pórtico es un estudio de fotografía y video de arquitectura, interiorismo y obra
    en Ciudad de Guatemala. Trabajamos con despachos de autor, interioristas,
    desarrolladores y corredores que necesitan que su obra se vea a la altura de su diseño.
  servicios:
    - nombre: "Obra terminada"
      detalle: "Fotografía y reels en una misma sesión, para portafolio, redes, publicaciones y concursos."
    - nombre: "Documentación de obra"
      detalle: "Registro mensual del avance en foto y reel, desde puntos fijos."
    - nombre: "Listados inmobiliarios"
      detalle: "Fotos y reels para corredores, listos para publicar en 48 horas."

contacto:
  nombre: "Bryan Castro"
  whatsapp: "+502 5413 1753"
  correo: "info@bcarqstudio.com"
  instagram: "portico.fa"

# Créditos: siempre como los confirma el cliente. Nunca inventar títulos.
proyectos:
  - id: navante
    obra: "Navante"
    autor: "Build & Create Studio"
    tipo: "Oficina corporativa · 96 m²"
    ubicacion: "Guatemala"
    anio: 2026
    servicio: "Fotografía de obra terminada"
    medio: foto
    descripcion: >-
      Oficina para una empresa de logística marítima y aérea: estaciones de trabajo
      abiertas, salas privadas en vidrio y luminarias lineales curvas que ordenan el espacio.
      El color marca cada función: turquesa, naranja y amarillo.
    portada: open-office.jpg
    encuadre_portada: "40% 50%"   # qué parte de una foto horizontal se ve en el panel vertical
    galeria: []
    # Fotos de cámara (Sony a6700). Las de celular quedan en la carpeta sin usarse.
    plena: [mueble-amarillo.jpg, open-office.jpg, mueble-turquesa.jpg, lampara-camara.jpg]

  - id: kishi-chiquimula
    obra: "Kishi Books"
    autor: "Build & Create Studio"
    tipo: "Mobiliario comercial · Librería"
    ubicacion: "Plaza Girasoles, Chiquimula"
    anio: 2026
    servicio: "Fotografía de obra terminada"
    medio: foto
    descripcion: >-
      Kioscos de madera curvada para una librería. Dos brazos curvos forman un recorrido
      interior: el cliente entra al kiosco en lugar de mirarlo desde fuera. La luz bajo
      cada nivel dibuja las curvas.
    portada: fachada.jpg
    encuadre_portada: "27% 50%"
    galeria: []
    plena: [esquina-curva.jpg, recorrido.jpg]

  - id: fragmento
    obra: "Fragmento"
    autor: "Fragmento Arquitectura"
    tipo: "Instalación — Interiorismo"
    ubicacion: "Ciudad de Guatemala"
    anio: 2026
    servicio: "Video vertical para Reels"
    duracion: "27 s"
    medio: video            # video | foto  (cambia los pies de imagen)
    descripcion: >-
      Piezas de vidrio iridiscente suspendidas sobre muros curvos. El recorrido en video
      sigue cómo la luz cambia el color de cada pieza según el ángulo y la hora.
    portada: 5.jpg
    galeria: [16.jpg, 19.jpg, 23.jpg, 1_5.jpg, 10_5.jpg, 13.jpg]
